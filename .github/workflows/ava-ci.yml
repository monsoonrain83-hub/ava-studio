name: AVA Studio quality gates
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "server.ts"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/ava-ci.yml"
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Validate generated assets
        run: test -s dist/index.html && test -d dist/assets
